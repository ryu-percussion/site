<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ryu — Maker / Artist / Researcher">
  <title>ryu — Maker / Artist / Researcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- SNSアイコン用 (FontAwesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- E8シミュレーション用ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header" id="top">
    <div class="nav-shell">
      <a class="brand" href="#top" aria-label="ryu home">ryu<span>.</span></a>
      <nav class="nav-links" aria-label="Primary">
        <a href="https://ryupercussion.lemonsqueezy.com/" target="_blank">Store</a>
        <a href="#about" data-i18n="nav.about">About</a>
        <a href="#career" data-i18n="nav.career">Career</a>
        <a href="#skills" data-i18n="nav.skills">Skills</a>
        <a href="#projects" data-i18n="nav.projects">Projects</a>
        <a href="#research" data-i18n="nav.research">Research</a>
        <a href="#contact" data-i18n="nav.contact">Contact</a>
      </nav>
      
      <!-- SNSアイコン -->
      <div class="header-social-icons">
        <a href="https://www.instagram.com/ryu_percussion/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.youtube.com/@ryu_percussion" target="_blank"><i class="fab fa-youtube"></i></a>
      </div>

      <div class="lang-switch" role="group" aria-label="Language switch">
        <button class="lang-btn active" type="button" data-lang="ja" aria-pressed="true">JP</button>
        <span>/</span>
        <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero section-pad">
      <div class="container">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 class="hero-title" data-i18n="hero.title"></h1>
        <p class="hero-lead" data-i18n="hero.lead"></p>
        <a class="text-link" href="#projects"><span data-i18n="hero.cta"></span> <b>↗</b></a>
      </div>
    </section>

    <section class="statement">
      <div class="container statement-grid">
        <p class="section-kicker" data-i18n="statement.kicker"></p>
        <div>
          <h2 data-i18n="statement.title"></h2>
          <p class="statement-sub" data-i18n="statement.sub"></p>
        </div>
      </div>
    </section>

    <section class="content-section section-pad" id="about">
      <div class="container two-col">
        <div class="section-heading">
          <p class="section-kicker">02 — <span data-i18n="nav.about">ABOUT</span></p>
          <h2 data-i18n="about.title"></h2>
        </div>
        <div class="prose">
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <p data-i18n="about.p3"></p>
        </div>
      </div>
    </section>

    <section class="dark-section section-pad" id="career">
      <div class="container">
        <div class="section-heading light">
          <p class="section-kicker">03 — <span data-i18n="nav.career">CAREER</span></p>
          <h2 data-i18n="career.title"></h2>
        </div>
        <div id="career-list" class="timeline"></div>
      </div>
    </section>

    <section class="content-section section-pad" id="skills">
      <div class="container">
        <div class="section-heading">
          <p class="section-kicker">04 — <span data-i18n="nav.skills">SKILLS</span></p>
          <h2 data-i18n="skills.title"></h2>
        </div>
        <div id="skills-grid" class="skills-grid"></div>
      </div>
    </section>

    <section class="project-section" id="projects">
      <div class="container section-pad">
        <div class="section-heading">
          <p class="section-kicker">05 — <span data-i18n="nav.projects">PROJECTS</span></p>
          <h2 data-i18n="projects.title"></h2>
        </div>
        
        <div class="projects-layout">
          <!-- 左側: 最新曲のフィーチャー -->
          <div class="projects-left">
            <div id="featured-project" class="featured-project"></div>
          </div>
          <!-- 右側: コンパクトなプロジェクトリスト -->
          <div class="projects-right">
            <div id="project-list" class="project-list compact-list"></div>
          </div>
        </div>

        <!-- E8シミュレーション コンテナ -->
        <div id="e8-simulation-section" style="margin-top: 100px;">
          <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 20px;">Interactive System: E8 Simulation</h3>
          <div id="e8-canvas-container" style="border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05);"></div>
          <div id="e8-ui-container" style="margin-top: 2px;"></div>
        </div>

      </div>
    </section>

    <section class="content-section section-pad" id="research">
      <div class="container">
        <div class="section-heading">
          <p class="section-kicker">06 — <span data-i18n="nav.research">RESEARCH</span></p>
          <h2 data-i18n="research.title"></h2>
        </div>
        <div id="research-list" class="research-list"></div>
      </div>
    </section>

    <section class="contact-section" id="contact">
      <div class="container">
        <p class="section-kicker">07 — <span data-i18n="nav.contact">CONTACT</span></p>
        <h2 data-i18n="contact.title"></h2>
        <p data-i18n="contact.body"></p>
        
        <div class="contact-grid">
          <!-- 左側: リンク -->
          <div class="contact-left">
            <a href="https://www.youtube.com/@ryu_percussion" target="_blank" class="contact-link"><i class="fab fa-youtube"></i> YouTube</a>
            <a href="https://www.instagram.com/ryu_percussion/" target="_blank" class="contact-link"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="mailto:info.ryupercussion@gmail.com" class="contact-link"><i class="fas fa-envelope"></i> info.ryupercussion@gmail.com</a>
          </div>
          <!-- 右側: Google Form -->
          <div class="contact-right">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe-0iWOhF6yVf4-B83bVd-Z9Tqg0t8a-a_A6q4vjZkEIg_t2Q/viewform?embedded=true" width="100%" height="600" frameborder="0" marginheight="0" marginwidth="0">読み込み中…</iframe>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <span>© <span id="year"></span> ryu</span>
      <a href="#top" data-i18n="footer.back">Back to top ↑</a>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
  <script src="e8.js"></script>
</body>
</html>
